  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

y: flex; justify-content: space-between; align-items: center;\n      flex-wrap: wrap; gap: var(--space-4); }\n    footer .f-brand { font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n      font-size: 18px; margin: 0 0 4px; }\n    footer .f-meta { font-size: 12.5px; margin: 0; color: var(--color-neutral-400); }\n    @media (max-width: 860px) { .hero { grid-template-columns: 1fr; } .figure { order: -1; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div>\n  <nav class=\"nav\">\n    <span class=\"nav-brand\">Taller de Barismo Profesional<\u002Fspan>\n    <a href=\"#dominar\">Qué dominas<\u002Fa>\n    <a href=\"#estructura\">Estructura<\u002Fa>\n    <a href=\"#instructor\">Instructor<\u002Fa>\n    <a href=\"{{ whatsappHref }}\" class=\"btn btn-primary\">WhatsApp<\u002Fa>\n  <\u002Fnav>\n\n  <div class=\"wrap\">\n\n    <section class=\"hero\">\n      <div>\n        <span class=\"tag tag-accent-2\">Formación práctica de baristas<\u002Fspan>\n        <h1 class=\"display\"><span class=\"line\">Del grano a la taza,<\u002Fspan> <span class=\"line\">en 3 sesiones.<\u002Fspan><\u002Fh1>\n        <p class=\"lede\" style=\"margin-top: var(--space-4);\">Nada de clases pasivas: calibra tu propio molino, extrae tu propio espresso y textura tu propia leche desde la primera sesión. 80% práctica, 100% café.<\u002Fp>\n        <div class=\"row\">\n          <a href=\"{{ whatsappHref }}\" class=\"btn btn-primary\">Escríbenos por WhatsApp<\u002Fa>\n          <a href=\"#estructura\" class=\"btn btn-ghost\">Ver la estructura<\u002Fa>\n        <\u002Fdiv>\n        <div class=\"stats\">\n          <div><p class=\"stat-num\">9h<\u002Fp><p class=\"stat-label\">de barra real<\u002Fp><\u002Fdiv>\n          <div><p class=\"stat-num\">80%<\u002Fp><p class=\"stat-label\">manos en la máquina<\u002Fp><\u002Fdiv>\n          <div><p class=\"stat-num\">3<\u002Fp><p class=\"stat-label\">sesiones presenciales<\u002Fp><\u002Fdiv>\n          <div><p class=\"stat-num\">6–10<\u002Fp><p class=\"stat-label\">personas por grupo<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <figure class=\"figure washed\">\n        <image-slot id=\"hero-photo\" shape=\"rect\" placeholder=\"Foto: barista extrayendo espresso en barra\" src=\"d0e172ee-4caa-4271-87c6-615e569f7d81\"><\u002Fimage-slot>\n      <\u002Ffigure>\n    <\u002Fsection>\n\n    <section class=\"sec\" id=\"dominar\">\n      <span class=\"kicker\">Qué vas a dominar<\u002Fspan>\n      <h2 class=\"sec-title\">Cuatro competencias, una taza impecable<\u002Fh2>\n      <p class=\"lede\">Cada una se practica, se corrige en vivo y se evalúa al final.<\u002Fp>\n      <div class=\"grid g4\">\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">01<\u002Fdiv><div class=\"card-title\">Del grano a la taza<\u002Fdiv><p class=\"card-body\">Origen, especies, niveles de tueste y ajuste de molienda.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">02<\u002Fdiv><div class=\"card-title\">Métodos filtrados<\u002Fdiv><p class=\"card-body\">V60, Chemex, prensa francesa y Aeropress.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">03<\u002Fdiv><div class=\"card-title\">Espresso profesional<\u002Fdiv><p class=\"card-body\">Calibración del molino y extracción consistente.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">04<\u002Fdiv><div class=\"card-title\">Leche y arte latte<\u002Fdiv><p class=\"card-body\">Microespuma, corazón y roseta.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\" id=\"estructura\">\n      <span class=\"kicker\">Cómo está estructurado<\u002Fspan>\n      <h2 class=\"sec-title\">Tres sesiones, dos rutas, un mismo grupo<\u002Fh2>\n      <p class=\"lede\">9 horas totales · 3 sesiones de 3 horas · 100% presencial. Cada sesión abre con dos rutas: iniciación para quien nunca tocó una máquina, y perfeccionamiento para quien ya trabaja en café.<\u002Fp>\n      <div class=\"grid\" style=\"gap: var(--space-3);\">\n        <div class=\"card elev-sm\">\n          <div class=\"step\">\n            <span class=\"step-n\">1<\u002Fspan>\n            <div>\n              <p class=\"step-t\">Café y métodos filtrados <span class=\"tag tag-neutral\">Sesión 1 · 3h<\u002Fspan><\u002Fp>\n              <p class=\"step-c\">Origen, tueste y molienda. Práctica rotativa en V60, Chemex, prensa francesa y Aeropress.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card elev-sm\">\n          <div class=\"step\">\n            <span class=\"step-n\">2<\u002Fspan>\n            <div>\n              <p class=\"step-t\">La máquina de espresso <span class=\"tag tag-neutral\">Sesión 2 · 3h<\u002Fspan><\u002Fp>\n              <p class=\"step-c\">Calibración del molino, extracción consistente, diagnóstico de defectos y limpieza.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"card elev-sm\">\n          <div class=\"step\">\n            <span class=\"step-n\">3<\u002Fspan>\n            <div>\n              <p class=\"step-t\">Leche, arte latte y servicio <span class=\"tag tag-neutral\">Sesión 3 · 3h<\u002Fspan><\u002Fp>\n              <p class=\"step-c\">Microespuma, latte art, simulación de barra real y evaluación práctica más examen escrito.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\">\n      <span class=\"kicker\">Qué incluye tu inscripción<\u002Fspan>\n      <h2 class=\"sec-title\">Lo que te llevas al terminar<\u002Fh2>\n      <div class=\"grid g4\">\n        <div class=\"card elev-sm\"><div class=\"card-title\">Constancia de competencias<\u002Fdiv><p class=\"card-body\">Detalla lo que demostraste, firmada y respaldada por la formación del instructor.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-title\">Carnet de calibración<\u002Fdiv><p class=\"card-body\">Registro de tus parámetros de extracción para replicarlos en cualquier barra.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-title\">Recetario de bebidas<\u002Fdiv><p class=\"card-body\">Un pequeño recetario con las bebidas que preparaste en el taller.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-title\">Bolsa de café<\u002Fdiv><p class=\"card-body\">De regalo, para que sigas practicando en casa desde el día siguiente.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\">\n      <div class=\"patch\">\n        <div>\n          <h3>$2,500 MXN por persona<\u002Fh3>\n          <p>Cupo limitado a 6–10 personas por cohorte. Escríbenos para conocer la próxima fecha disponible.<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"{{ whatsappHref }}\" class=\"btn btn-primary\">Reservar mi lugar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\" id=\"instructor\">\n      <span class=\"kicker\">Quién te enseña<\u002Fspan>\n      <h2 class=\"sec-title\">Roberto Alejandro Villicaña Mora<\u002Fh2>\n      <p class=\"lede\">Barista formado y certificado en barra de cadena internacional, con credencial de <strong>Barista Trainer<\u002Fstrong> — es decir, formado específicamente para enseñar el oficio, no solo para ejercerlo. El taller nace de ese entrenamiento y de años de servicio en barra real.<\u002Fp>\n      <div class=\"grid g3\">\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Certificación<\u002Fdiv><div class=\"card-title\">Barista Trainer<\u002Fdiv><p class=\"card-body\">Acreditación para formar y evaluar baristas, otorgada en programa corporativo de capacitación (2026).<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Certificación<\u002Fdiv><div class=\"card-title\">Global Barista 30, 90 y 180<\u002Fdiv><p class=\"card-body\">Ruta completa de formación de barista: fundamentos, consolidación y dominio (2026).<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">Experiencia<\u002Fdiv><div class=\"card-title\">Barra de alto volumen<\u002Fdiv><p class=\"card-body\">Servicio real bajo presión: consistencia, tiempos y atención a cliente en operación diaria.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\" id=\"constancia\">\n      <span class=\"kicker\">Tu constancia de competencias<\u002Fspan>\n      <h2 class=\"sec-title\">Honesta, y por eso más útil<\u002Fh2>\n      <p class=\"lede\">No somos una institución con registro oficial, y no vamos a pretenderlo. Lo que te entregamos vale más para una barra real: un documento que dice exactamente qué demostraste hacer, respaldado por la formación de quien te evaluó.<\u002Fp>\n      <div class=\"grid g3\">\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">01<\u002Fdiv><div class=\"card-title\">Constancia de participación<\u002Fdiv><p class=\"card-body\">Acredita las 9 horas completadas del Taller de Barismo Profesional, con fecha y sede.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">02<\u002Fdiv><div class=\"card-title\">Competencias demostradas<\u002Fdiv><p class=\"card-body\">El detalle de lo que lograste: calibración, extracción consistente, texturizado, latte art y resultado del examen escrito. Un empleador lo lee y sabe qué sabes hacer.<\u002Fp><\u002Fdiv>\n        <div class=\"card elev-sm\"><div class=\"card-kicker\">03<\u002Fdiv><div class=\"card-title\">Respaldo del instructor<\u002Fdiv><p class=\"card-body\">Firmada, con las certificaciones de barismo del instructor al pie — la autoridad viene de la formación real de quien enseña.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showRoadmap }}\" hint-placeholder-val=\"{{ true }}\">\n      <section class=\"sec\">\n        <span class=\"kicker\">Lo que viene<\u002Fspan>\n        <h2 class=\"sec-title\">El primero de cuatro programas<\u002Fh2>\n        <p class=\"lede\">Este taller es la puerta de entrada a una academia de café en construcción — más rutas para seguir creciendo después de la constancia.<\u002Fp>\n        <div class=\"row roadmap\">\n          <span class=\"tag tag-accent-2\">Bebidas Heladas y Recetario · Próximamente<\u002Fspan>\n          <span class=\"tag tag-accent-2\">Servicio al Cliente e Inocuidad · Próximamente<\u002Fspan>\n          <span class=\"tag tag-accent-2\">Curso Básico de Barista en Casa · Próximamente<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsection>\n    <\u002Fsc-if>\n\n    <section class=\"sec\">\n      <span class=\"kicker\">Preguntas frecuentes<\u002Fspan>\n      <h2 class=\"sec-title\">Antes de inscribirte<\u002Fh2>\n      <div class=\"grid\" style=\"gap: var(--space-2); max-width: 860px;\">\n        <sc-for list=\"{{ faqs }}\" as=\"item\" hint-placeholder-count=\"7\">\n          <div class=\"card elev-sm\">\n            <button type=\"button\" class=\"faq-q\" sc-camel-on-click=\"{{ item.toggle }}\">\n              <span>{{ item.q }}<\u002Fspan>\n              <span class=\"faq-mark\">{{ item.marker }}<\u002Fspan>\n            <\u002Fbutton>\n            <sc-if value=\"{{ item.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <p class=\"faq-a\">{{ item.a }}<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\">\n      <span class=\"kicker\">Evidencia del primer curso<\u002Fspan>\n      <h2 class=\"sec-title\">Ya se impartió, y así salió<\u002Fh2>\n      <p class=\"lede\">Primera capacitación cerrada y entregada — bebidas preparadas por las participantes y la conversación con la cafetería que la contrató.<\u002Fp>\n      <div class=\"ev-grid\">\n        <figure>\n          <a class=\"ev-item\" href=\"./evidencia-whatsapp.png\" target=\"_blank\" rel=\"noopener\">\n            <img src=\"6a51a348-ecf5-43cd-984e-661f8564a040\" alt=\"Conversación con la cafetería que contrató la capacitación\">\n          <\u002Fa>\n          <p class=\"ev-cap\">La cafetería que la contrató · toca para ampliar<\u002Fp>\n        <\u002Ffigure>\n        <figure>\n          <a class=\"ev-item washed\" href=\"./evidencia-bebidas.jpeg\" target=\"_blank\" rel=\"noopener\">\n            <img src=\"30b2370d-1956-4052-a72a-e58e74539d0a\" alt=\"Bebidas preparadas por las participantes durante el taller\">\n          <\u002Fa>\n          <p class=\"ev-cap\">Bebidas de las participantes · toca para ampliar<\u002Fp>\n        <\u002Ffigure>\n        <figure>\n          <a class=\"ev-item\" href=\"./evidencia-testimonio.png\" target=\"_blank\" rel=\"noopener\">\n            <img src=\"3653b9e0-621c-418e-9d6f-67bc3482955c\" alt=\"Testimonio recibido tras la capacitación\">\n          <\u002Fa>\n          <p class=\"ev-cap\">Testimonio de una participante · toca para ampliar<\u002Fp>\n        <\u002Ffigure>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section class=\"sec\">\n      <span class=\"kicker\">Testimonios<\u002Fspan>\n      <h2 class=\"sec-title\">Lo que dicen quienes ya pasaron por la barra<\u002Fh2>\n      <div class=\"card elev-sm\" style=\"max-width: 760px;\">\n        <p class=\"quote\" style=\"font-size: 18px;\">“Tomé una capacitación de Barista con él y quedé muy satisfecha. Explica todo de una manera muy clara y sencilla, desde los conceptos del café hasta su preparación. Es una persona muy paciente, amable y siempre está dispuesto a resolver dudas.”<\u002Fp>\n        <div class=\"card-meta\"><span>Participante de la primera capacitación<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <footer>\n    <div class=\"wrap\">\n      <div>\n        <p class=\"f-brand\">Taller de Barismo Profesional<\u002Fp>\n        <p class=\"f-meta\">Uruapan, Michoacán · @Robert.vill<\u002Fp>\n      <\u002Fdiv>\n      <a href=\"{{ whatsappHref }}\" class=\"btn btn-primary\">Escríbenos por WhatsApp<\u002Fa>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280}, &quot;whatsappNumber&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;524521232074&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contacto&quot;}, &quot;whatsappMessage&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;Hola, quiero información del Taller de Barismo Profesional&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Contacto&quot;}, &quot;showRoadmapTeaser&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Secciones&quot;}}\">\nclass Component extends DCLogic {\n  state = { openIndex: 0 };\n\n  faqData = [\n    { q: '¿Necesito experiencia previa?', a: 'No. El taller tiene dos rutas dentro del mismo grupo: iniciación para quien nunca ha tocado una máquina, y perfeccionamiento para quien ya trabaja en café.' },\n    { q: '¿Qué necesito llevar?', a: 'Nada. Todo el café, la leche y el equipo están disponibles durante las tres sesiones.' },\n    { q: '¿Cuántas personas hay por grupo?', a: 'Entre 6 y 10, para garantizar tiempo real de máquina para cada quien.' },\n    { q: '¿Cómo se evalúa?', a: 'Con una evaluación práctica en simulación de barra real, más un examen escrito de conceptos.' },\n    { q: '¿Qué me llevo al terminar?', a: 'Tu constancia de competencias firmada, tu carnet de calibración, un pequeño recetario de bebidas y una bolsa de café de regalo.' },\n    { q: '¿La constancia tiene validez oficial?', a: 'No somos una institución con registro oficial y no lo presentamos como tal. La constancia detalla las competencias que demostraste en la evaluación y va respaldada por las certificaciones de barismo del instructor — es lo que un dueño de cafetería realmente necesita leer.' },\n    { q: '¿Dónde son las sesiones?', a: 'En Uruapan, Michoacán, 100% presencial.' },\n  ];\n\n  renderVals() {\n    const number = this.props.whatsappNumber ?? '524521232074';\n    const message = this.props.whatsappMessage ?? 'Hola, quiero información del Taller de Barismo Profesional';\n    const faqs = this.faqData.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      open: this.state.openIndex === i,\n      marker: this.state.openIndex === i ? '–' : '+',\n      toggle: () => this.setState(s => ({ openIndex: s.openIndex === i ? null : i })),\n    }));\n    return {\n      whatsappHref: 'https://wa.me/' + number + '?text=' + encodeURIComponent(message),\n      showRoadmap: this.props.showRoadmapTeaser ?? true,\n      faqs,\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
